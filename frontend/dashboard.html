<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon espace — SereniSpa</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/style.css">
  <style>
    /* ── Navbar ─────────────────────────────────────────── */
    .dash-nav {
      background: var(--ivory);
      border-bottom: 1px solid var(--ivory-mid);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .dash-nav-logo {
      font-family: var(--ff-title);
      font-size: 1.5rem;
      letter-spacing: 4px;
      color: var(--brun);
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .dash-nav-logo span { color: var(--sage); }
    .dash-nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .dash-greeting {
      font-size: 13px;
      color: var(--brun-light);
      font-family: var(--ff-body);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    /* ── Layout principal ────────────────────────────────── */
    .dash-main { max-width: 860px; margin: 0 auto; padding: 3rem 2rem; }

    /* ── Header ─────────────────────────────────────────── */
    .dash-header { margin-bottom: 2.5rem; }
    .dash-header-label {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--sage);
      margin-bottom: 0.5rem;
    }
    .dash-header h1 {
      font-family: var(--ff-title);
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 700;
      color: var(--brun);
      line-height: 1.2;
    }

    /* ── Stats ───────────────────────────────────────────── */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .dash-stat {
      background: #fff;
      border: 1px solid var(--ivory-mid);
      border-radius: 8px;
      padding: 1.5rem 1rem;
      text-align: center;
    }
    .dash-stat-value {
      font-family: var(--ff-title);
      font-size: 2.4rem;
      color: var(--sage);
      font-weight: 300;
      line-height: 1;
    }
    .dash-stat-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--brun-light);
      margin-top: 8px;
    }

    /* ── Section title ───────────────────────────────────── */
    .dash-section-title {
      font-family: var(--ff-title);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--brun);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ivory-mid);
      padding-bottom: 0.75rem;
    }

    /* ── Agendements ─────────────────────────────────────── */
    .agendement-list { display: flex; flex-direction: column; gap: 10px; }
    .agendement-card {
      background: #fff;
      border: 1px solid var(--ivory-mid);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 0.3s;
    }
    .agendement-card:hover { border-color: var(--sage-light); }
    .agendement-info { flex: 1; min-width: 0; }
    .agendement-soin {
      font-family: var(--ff-title);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--brun);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agendement-meta {
      font-size: 12px;
      color: var(--brun-light);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agendement-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── Badges ──────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-confirme { background: #e8f3ea; color: var(--sage-dark); }
    .badge-annule   { background: #fdf0f0; color: #b94040; }
    .badge-attente  { background: #fdf7ed; color: var(--mocha-dark); }

    .btn-annuler {
      background: none;
      border: 1px solid var(--ivory-mid);
      border-radius: 3px;
      padding: 5px 12px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--brun-light);
      transition: all 0.3s;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-annuler:hover { border-color: #b94040; color: #b94040; }

    /* ── Empty / Loading ─────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: #fff;
      border: 1px solid var(--ivory-mid);
      border-radius: 8px;
    }
    .empty-state p {
      font-family: var(--ff-body);
      color: var(--brun-light);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      font-family: var(--ff-body);
      color: var(--brun-light);
      font-size: 0.9rem;
    }

    /* ── RESPONSIVO ──────────────────────────────────────── */
    @media (max-width: 600px) {
      /* Navbar mobile */
      .dash-nav {
        padding: 0 1rem;
        height: auto;
        min-height: 64px;
        flex-wrap: wrap;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
        gap: 0.5rem;
      }
      .dash-nav-logo { font-size: 1.2rem; letter-spacing: 2px; }
      .dash-nav-right {
        width: 100%;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .dash-greeting {
        font-size: 12px;
        max-width: 120px;
      }
      .dash-nav-right .btn {
        font-size: 11px;
        padding: 8px 12px;
      }

      /* Main */
      .dash-main { padding: 1.5rem 1rem; }

      /* Stats — 3 colunas pequenas no mobile */
      .dash-stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }
      .dash-stat { padding: 1rem 0.5rem; }
      .dash-stat-value { font-size: 1.8rem; }
      .dash-stat-label { font-size: 9px; letter-spacing: 0.5px; }

      /* Cards agendement */
      .agendement-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
        gap: 0.75rem;
      }
      .agendement-info { width: 100%; }
      .agendement-soin { white-space: normal; }
      .agendement-meta { white-space: normal; }
      .agendement-actions {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 380px) {
      .dash-nav-logo { font-size: 1rem; letter-spacing: 1px; }
      .dash-greeting { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="dash-nav">
    <a href="index.html" class="dash-nav-logo">SERENI<span>SPA</span></a>
    <div class="dash-nav-right">
      <span class="dash-greeting" id="dash-greeting"></span>
      <button class="btn btn-ghost" id="btn-nouvelle-reservation">+ Réserver</button>
      <button class="btn btn-primary" id="btn-logout">Déconnexion</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="dash-main">

    <div class="dash-header">
      <div class="dash-header-label">Massage & Bien-être · Valence</div>
      <h1 id="dash-title">Mon espace</h1>
    </div>

    <!-- STATS -->
    <div class="dash-stats">
      <div class="dash-stat">
        <div class="dash-stat-value" id="stat-total">—</div>
        <div class="dash-stat-label">Réservations</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-value" id="stat-prochain">—</div>
        <div class="dash-stat-label">Prochain soin</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-value" id="stat-confirme">—</div>
        <div class="dash-stat-label">Confirmés</div>
      </div>
    </div>

    <!-- AGENDEMENTS -->
    <div class="dash-section-title">
      Mes rendez-vous
    </div>

    <div id="agendements-container">
      <div class="loading">Chargement de vos rendez-vous...</div>
    </div>

  </main>

  <!-- MODAL RESERVA -->
  <div class="modal-overlay" id="modal-booking">
    <div class="modal" role="dialog" aria-modal="true" style="max-width:440px;">
      <button class="modal-close" id="modal-booking-close" aria-label="Fermer">&times;</button>
      <div class="modal-header">
        <span class="label-sm">Nouvelle réservation</span>
        <h2 class="title-md" id="booking-title">Choisir un praticien</h2>
      </div>
      <div class="steps-nav">
        <div class="step-dot active" data-step="1">Praticien</div>
        <div class="step-dot" data-step="2">Soin</div>
        <div class="step-dot" data-step="3">Date & heure</div>
        <div class="step-dot" data-step="4">Confirmer</div>
      </div>

      <!-- STEP 1 -->
      <div class="step-panel active" id="step-1">
        <div style="padding:1.5rem;text-align:center;color:var(--brun-light);font-size:14px;">Chargement...</div>
      </div>

      <!-- STEP 2 -->
      <div class="step-panel" id="step-2">
        <div style="padding:1.5rem;text-align:center;color:var(--brun-light);font-size:14px;">Chargement...</div>
      </div>

      <!-- STEP 3 -->
      <div class="step-panel" id="step-3">
        <div class="form-group">
          <label class="form-label" for="booking-date">Date souhaitée</label>
          <input class="form-input" type="date" id="booking-date">
        </div>
        <div id="slots-container" style="display:none;">
          <label class="form-label" style="margin-bottom:8px;">Créneaux disponibles</label>
          <div class="slots-grid" id="slots-grid"></div>
        </div>
        <div id="slots-loading" style="display:none;font-size:13px;color:var(--brun-light);padding:8px 0;">Chargement...</div>
        <div class="step-actions">
          <button class="btn btn-back" id="step3-back">Retour</button>
          <button class="btn btn-primary" id="step3-next" disabled>Continuer</button>
        </div>
      </div>

      <!-- STEP 4 -->
      <div class="step-panel" id="step-4">
        <div class="booking-summary" id="booking-summary"></div>
        <div class="alert alert-error" id="booking-error"></div>
        <div class="step-actions">
          <button class="btn btn-back" id="step4-back">Retour</button>
          <button class="btn btn-mocha" id="btn-confirmer">Confirmer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="src/dashboard.js" defer></script>
</body>
</html>
